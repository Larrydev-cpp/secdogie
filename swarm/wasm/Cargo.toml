[package]
name = "secdogie-swarm-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic, non-invasive public-source route reconstruction adapter for SecDogie"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
