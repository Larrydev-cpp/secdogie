[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secdogie-node"
version = "0.1.0"
description = "A running node of the secdogie mesh: DID-authenticated (optionally encrypted) UDP transport, membership gossip and signed-journal replication in one process."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["secdogie-identity", "secdogie-transport", "secdogie-citadel"]

[project.scripts]
secdogie-node = "secdogie_node.cli:main"

[tool.setuptools.packages.find]
include = ["secdogie_node*"]
