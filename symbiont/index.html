<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>共生体</title>
<link rel="stylesheet" href="./app.css">
<script type="module" src="./dist/ui/main.js"></script>
</head>
<body>
<header class="top">
  <div class="column top-row" id="presence" aria-describedby="presence-hint">
    <span class="dot" id="dot" data-phase="connecting" aria-hidden="true"></span>
    <span class="presence-label" id="presence-label">共生体: 正在连接</span>
    <span class="visually-hidden" id="presence-hint"></span>
  </div>
</header>
<main class="column">
  <ol class="thread" id="thread" aria-live="polite"></ol>
  <p class="ambient" id="ambient" hidden></p>
</main>
<div class="dock">
  <form class="composer" id="composer" autocomplete="off">
    <textarea id="input" rows="1" aria-label="message" spellcheck="true" enterkeyhint="send"></textarea>
    <button type="button" class="stop" id="stop" hidden>停下</button>
    <button type="submit" class="send" id="send">发送</button>
  </form>
</div>
</body>
</html>
