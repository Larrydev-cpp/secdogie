[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secdogie-transport"
version = "0.5.0"
description = "A P2P-ready peer/session/endpoint transport model: upper layers depend on an authenticated peer session (a DID bound to a transport key) instead of a hub socket."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Peer identity comes from a verified DID<->transport binding.
dependencies = ["secdogie-identity"]

[project.optional-dependencies]
# WebRTC between your own devices (rtc.py, pairing_session.py, mesh_rtc.py) and
# the signaling gateway you can run yourself (signal_server.py).
webrtc = ["aiortc>=1.9", "websockets>=13"]

[project.scripts]
secdogie-relay = "secdogie_transport.relay_node:main"
secdogie-signal = "secdogie_transport.signal_server:main"

[tool.setuptools.packages.find]
include = ["secdogie_transport*"]
