[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secdogie-transport"
version = "0.5.0"
description = "A P2P-ready peer/session/endpoint transport model: upper layers depend on an authenticated peer session (a DID bound to a transport key) instead of a hub socket."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Peer identity comes from a verified DID<->transport binding.
dependencies = ["secdogie-identity"]

[project.optional-dependencies]
# The WebRTC data-channel link (webrtc.py): the node's end of the browser link.
# Data only -- the link refuses any SDP with audio or video and adds no track.
webrtc = ["aiortc>=1.10,<2", "websockets>=14,<18", "cryptography>=42"]
# The record layer of the browser link (linkcipher.py): libsodium's crypto_kx
# (through PyNaCl) and AES-256-GCM (cryptography). Pure Python wheels, no
# network stack -- enough to generate and check the test vectors.
linkcipher = ["cryptography>=42"]

[project.scripts]
secdogie-relay = "secdogie_transport.relay_node:main"

[tool.setuptools.packages.find]
include = ["secdogie_transport*"]
