[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secdogie-graph"
version = "0.1.0"
description = "Python ctypes binding for the secdogie graph route adapter and canonical JSON"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["secdogie_graph*"]
