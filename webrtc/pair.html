<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>secdogie · 配对</title>
<style>
  /* Night: ink-blue ground, rice-paper text, gold leaf for what you act on,
     celadon for "this checks out", cinnabar only for the seal. */
  :root {
    --ground: #141821;   /* 黛 */
    --deep: #0f121a;     /* 墨 */
    --silk: #1c212d;     /* 绢 */
    --paper: #f0e7d3;    /* 宣纸 */
    --smoke: #bcb3a0;    /* 烟 */
    --ash: #958d7e;      /* 苍 */
    --gold: #d9b46c;     /* 泥金 */
    --gold-hi: #e6c88d;
    --celadon: #8ebba8;  /* 青瓷 */
    --apricot: #e2a65a;  /* 杏黄 */
    --cinnabar: #d0573f; /* 朱砂 */
    --seal-ink: #f7efe0;
    --rule: rgba(240, 231, 211, 0.12);
    --on-gold: #0f121a;
    --hill-far: #1a1f2b;
    --hill-near: #171b25;
    --moon: rgba(217, 180, 108, 0.16);
    --moon-halo: rgba(217, 180, 108, 0.05);
    --shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.7), 0 2px 6px -2px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground: #f0e7d3;
      --deep: #faf5ea;
      --silk: #e8dec8;
      --paper: #1f2330;
      --smoke: #4e4739;
      --ash: #625948;
      --gold: #7d5510;
      --gold-hi: #6a470b;
      --celadon: #2f6552;
      --apricot: #8c5414;
      --cinnabar: #b23a26;
      --seal-ink: #fbf6ec;
      --rule: rgba(31, 35, 48, 0.14);
      --on-gold: #faf5ea;
      --hill-far: #e6dcc6;
      --hill-near: #ebe2ce;
      --moon: rgba(125, 85, 16, 0.10);
      --moon-halo: rgba(125, 85, 16, 0.04);
      --shadow: 0 18px 40px -26px rgba(60, 45, 20, 0.45), 0 2px 6px -3px rgba(60, 45, 20, 0.2);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ground);
    color: var(--paper);
    font: 16px/1.75 "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Georgia, "Times New Roman", serif;
    caret-color: var(--gold);
    scrollbar-color: var(--ash) var(--ground);
    text-rendering: optimizeLegibility;
  }
  /* English punctuation from a Latin serif: the CJK faces draw “ ’ full-width */
  html[lang="en"] body {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif", "DejaVu Serif",
      "Noto Serif SC", "Songti SC", serif;
  }
  ::selection { background: var(--gold); color: var(--on-gold); }

  .hills { position: absolute; inset: 0 0 auto 0; width: 100%; height: 240px; pointer-events: none; }
  .moon {
    position: absolute; top: 34px; right: max(24px, calc(50% - 25rem));
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--moon); box-shadow: 0 0 48px 12px var(--moon-halo);
    pointer-events: none;
  }
  @media (max-width: 720px) { .moon { top: 66px; width: 30px; height: 30px; box-shadow: 0 0 28px 6px var(--moon-halo); } }
  .page {
    position: relative;
    max-width: 40rem;
    margin: 0 auto;
    padding: 20px 16px 56px;
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { color: var(--smoke); font-size: 15px; letter-spacing: 0.08em; text-decoration: none; }
  .brand:hover { color: var(--paper); }
  .lang { display: inline-flex; border: 1px solid var(--ash); border-radius: 999px; padding: 2px; }
  .lang button {
    border: 0; background: transparent; color: var(--smoke); font: inherit; font-size: 13px; line-height: 1;
    padding: 7px 12px; border-radius: 999px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--paper); color: var(--ground); }

  .inscription {
    display: none;
    position: absolute; top: 112px; right: -64px;
    writing-mode: vertical-rl; letter-spacing: 0.5em;
    color: var(--gold); opacity: 0.55; font-size: 15px;
  }
  @media (min-width: 900px) { html[lang^="zh"] .inscription { display: block; } }

  main { margin-top: 72px; }
  h1 {
    margin: 0 0 14px;
    font-size: clamp(1.75rem, 5.4vw, 2.4rem);
    line-height: 1.3;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-wrap: balance;
  }
  html[lang="en"] h1 { letter-spacing: -0.01em; }
  .lede { margin: 0; color: var(--smoke); max-width: 34em; }

  .steps {
    list-style: none; margin: 32px 0 28px; padding: 0;
    display: grid; grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--rule);
  }
  .steps li {
    position: relative; padding-top: 12px; color: var(--ash); font-size: 14px; line-height: 1.4;
  }
  .steps li::before {
    content: ""; position: absolute; top: -2px; left: 0; width: 0; height: 3px; background: var(--gold);
    transition: width 420ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .steps li .n { display: block; font-size: 13px; margin-bottom: 2px; }
  .steps li[data-done] { color: var(--smoke); }
  .steps li[data-done]::before { width: 100%; background: var(--ash); }
  .steps li[aria-current="step"] { color: var(--paper); }
  .steps li[aria-current="step"]::before { width: 100%; }

  section { margin-top: 8px; }
  section[hidden] { display: none; }
  .sheet {
    background: var(--silk);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 22px 20px;
    box-shadow: var(--shadow);
  }
  h2 { margin: 0 0 6px; font-size: 1.25rem; font-weight: 600; letter-spacing: 0.03em; line-height: 1.4; }
  .sub { margin: 0 0 18px; color: var(--smoke); }
  .fine { font-size: 14px; color: var(--smoke); line-height: 1.65; }

  .field { display: grid; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 14px; color: var(--smoke); }
  .field .hint { font-size: 13px; color: var(--ash); line-height: 1.55; }
  input[type="text"], input[type="url"], textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--ash); background: var(--deep); color: var(--paper);
    font: inherit; font-size: 16px; line-height: 1.5;
  }
  input::placeholder, textarea::placeholder { color: var(--ash); opacity: 1; }
  textarea.link {
    font: 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    resize: none; height: 6.6em; word-break: break-all; color: var(--smoke);
  }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px; }
  button.act {
    appearance: none; cursor: pointer;
    font: inherit; font-size: 16px; font-weight: 600; letter-spacing: 0.04em;
    padding: 11px 20px; border-radius: 10px;
    border: 1px solid var(--gold); background: var(--gold); color: var(--on-gold);
    transition: background-color 160ms ease-out, border-color 160ms ease-out, transform 160ms ease-out;
  }
  button.act:hover { background: var(--gold-hi); border-color: var(--gold-hi); }
  button.act:active { transform: translateY(1px); }
  button.act.quiet { background: transparent; color: var(--paper); border-color: var(--ash); font-weight: 500; }
  button.act.quiet:hover { border-color: var(--paper); }
  button.act:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  button.act[aria-busy="true"] { cursor: progress; }
  button.text {
    appearance: none; border: 0; background: none; padding: 4px 0; cursor: pointer;
    font: inherit; font-size: 14px; color: var(--smoke);
    text-decoration: underline; text-decoration-color: var(--ash); text-underline-offset: 4px;
  }
  button.text:hover { color: var(--paper); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
  input:focus-visible, textarea:focus-visible { outline-offset: 1px; }

  .clock { margin-left: auto; font-size: 14px; color: var(--smoke); font-variant-numeric: tabular-nums; }
  .waiting { display: flex; align-items: center; gap: 10px; margin-top: 18px; color: var(--smoke); font-size: 15px; }
  .ember {
    width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex: none;
    animation: ember 2.4s ease-in-out infinite;
  }
  @keyframes ember { 50% { opacity: 0.3; } }

  /* the invitation as the joining device sees it */
  dl.letter { margin: 0 0 20px; display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; }
  dl.letter dt { color: var(--ash); font-size: 14px; }
  dl.letter dd { margin: 0; overflow-wrap: anywhere; }
  .did { font: 13px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--smoke); }

  .code {
    display: flex; justify-content: center; gap: 0.6em;
    margin: 6px 0 10px; padding: 18px 0 16px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    font-size: clamp(2.6rem, 13vw, 3.6rem); line-height: 1; font-weight: 600;
    letter-spacing: 0.14em; font-variant-numeric: tabular-nums; color: var(--paper);
  }
  .code span:last-child { margin-right: -0.14em; }
  .who { text-align: center; margin: 0 0 20px; color: var(--smoke); font-size: 15px; }

  .seal {
    width: 3.25rem; height: 3.25rem; flex: none;
    display: grid; place-items: center;
    background: var(--cinnabar); color: var(--seal-ink);
    border-radius: 6px; box-shadow: inset 0 0 0 3px var(--cinnabar), inset 0 0 0 4.5px var(--seal-ink);
    font-size: 1.6rem; font-weight: 700; line-height: 1;
    transform: rotate(-4deg);
  }
  .sealed { display: flex; gap: 18px; align-items: flex-start; }
  .sealed h2 { margin-top: 2px; }
  .stamp { animation: stamp 520ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes stamp {
    from { transform: rotate(-4deg) scale(1.35); opacity: 0; filter: blur(2px); }
    to { transform: rotate(-4deg) scale(1); opacity: 1; filter: blur(0); }
  }
  .unroll { animation: unroll 560ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes unroll { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }

  .status { min-height: 1.75em; margin: 18px 0 0; font-size: 15px; color: var(--smoke); }
  .status[data-tone="ok"] { color: var(--celadon); }
  .status[data-tone="warn"] { color: var(--apricot); }
  .reason { margin: 0 0 4px; color: var(--apricot); }

  .mine { margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--rule); }
  .mine h2 { font-size: 1.05rem; }
  .devices { list-style: none; margin: 8px 0 18px; padding: 0; }
  .devices li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .devices li:last-child { border-bottom: 0; }
  .devices .when { color: var(--ash); font-size: 14px; font-variant-numeric: tabular-nums; flex: none; }
  .empty { color: var(--ash); font-size: 15px; margin: 8px 0 18px; }
  .owner-id { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin: 4px 0 8px; }

  footer { margin-top: 40px; color: var(--ash); font-size: 13px; line-height: 1.7; }
  footer p { margin: 0; max-width: 38em; }

  @media (max-width: 520px) {
    main { margin-top: 48px; }
    .sheet { padding: 18px 16px; border-radius: 12px; }
    .steps li { font-size: 13px; }
    dl.letter { grid-template-columns: 1fr; gap: 2px; }
    dl.letter dd { margin-bottom: 8px; }
    .actions button.act { flex: 1 1 auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-phase="loading">
<svg class="hills" viewBox="0 0 1200 240" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="fade-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--hill-far)"/>
      <stop offset="1" style="stop-color: var(--ground)"/>
    </linearGradient>
    <linearGradient id="fade-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--hill-near)"/>
      <stop offset="1" style="stop-color: var(--ground)"/>
    </linearGradient>
  </defs>
  <path d="M0 150 C 70 132 120 96 190 108 S 300 70 372 92 S 470 50 548 84 S 650 124 720 98 S 842 58 918 90 S 1060 128 1200 104 L1200 240 L0 240 Z" fill="url(#fade-far)"/>
  <path d="M0 196 C 110 176 170 146 262 166 S 408 140 488 162 S 640 196 728 166 S 896 150 980 172 S 1110 168 1200 150 L1200 240 L0 240 Z" fill="url(#fade-near)"/>
</svg>

<div class="moon" aria-hidden="true"></div>
<div class="page">
  <header class="top">
    <a class="brand" href="./pair.html">secdogie</a>
    <div class="lang" role="group" aria-label="Language / 语言">
      <button type="button" data-lang="zh" aria-pressed="true">中</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <p class="inscription" aria-hidden="true">吾之器物　自成一网</p>

  <main>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>

    <ol class="steps" id="steps">
      <li><span class="n">壹</span><span data-t="step.write"></span></li>
      <li><span class="n">贰</span><span data-t="step.agree"></span></li>
      <li><span class="n">叁</span><span data-t="step.compare"></span></li>
      <li><span class="n">肆</span><span data-t="step.admit"></span></li>
    </ol>

    <!-- inviting: write the invitation -->
    <section id="form" class="sheet" hidden>
      <form id="invite-form" novalidate>
        <div class="field">
          <label for="mesh" data-t="form.mesh"></label>
          <input id="mesh" type="text" maxlength="64" autocomplete="off" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="owner-name" data-t="form.name"></label>
          <input id="owner-name" type="text" maxlength="40" autocomplete="off" data-ph="form.name.ph">
        </div>
        <div class="field">
          <label for="signal" data-t="form.signal"></label>
          <input id="signal" type="url" autocomplete="off" spellcheck="false" inputmode="url" required>
          <span class="hint" data-t="form.signal.hint"></span>
        </div>
        <div class="actions">
          <button class="act" id="write" type="submit" data-t="form.write"></button>
        </div>
      </form>
    </section>

    <!-- inviting: the link, while waiting for the other device -->
    <section id="out" class="sheet" hidden>
      <h2 data-t="out.title"></h2>
      <p class="sub" data-t="out.sub"></p>
      <textarea class="link" id="link" readonly rows="4" aria-labelledby="link-label"></textarea>
      <span id="link-label" hidden data-t="out.title"></span>
      <div class="actions" style="margin-top: 12px">
        <button class="act" id="copy" type="button" data-t="out.copy"></button>
        <button class="text" id="withdraw" type="button" data-t="out.withdraw"></button>
        <span class="clock" id="clock"></span>
      </div>
      <p class="waiting"><span class="ember" aria-hidden="true"></span><span id="waiting-text" data-t="out.waiting"></span></p>
    </section>

    <!-- joining: the invitation as received -->
    <section id="card" class="sheet" hidden>
      <dl class="letter">
        <dt data-t="card.from"></dt><dd><span class="did" id="card-from"></span></dd>
        <dt data-t="card.mesh"></dt><dd id="card-mesh"></dd>
        <dt data-t="card.until"></dt><dd id="card-until"></dd>
        <dt data-t="card.signal"></dt><dd id="card-signal"></dd>
      </dl>
      <form id="agree-form" novalidate>
        <div class="field">
          <label for="device-name" data-t="form.name"></label>
          <input id="device-name" type="text" maxlength="40" autocomplete="off" data-ph="card.name.ph">
        </div>
        <div class="actions">
          <button class="act" id="agree" type="submit" data-t="card.agree"></button>
        </div>
      </form>
      <p class="fine" style="margin: 14px 0 0" data-t="card.offline"></p>
    </section>

    <!-- joining: an invitation that cannot be used -->
    <section id="invalid" class="sheet" hidden>
      <h2 data-t="invalid.title"></h2>
      <p class="reason" id="invalid-reason"></p>
      <p class="fine" style="margin: 8px 0 0" data-t="invalid.next"></p>
    </section>

    <!-- both: compare the six digits -->
    <section id="compare" class="sheet" hidden>
      <h2 data-t="compare.title"></h2>
      <p class="sub" id="compare-sub"></p>
      <div class="code unroll" id="code" aria-live="polite"></div>
      <p class="who" id="who"></p>
      <div class="actions">
        <button class="act" id="admit" type="button" data-t="compare.admit"></button>
        <button class="act quiet" id="differ" type="button" data-t="compare.differ"></button>
      </div>
    </section>

    <!-- both: done -->
    <section id="done" class="sheet" hidden>
      <div class="sealed">
        <div class="seal stamp" aria-hidden="true">纳</div>
        <div>
          <h2 id="done-title"></h2>
          <p class="sub" id="done-sub" style="margin-bottom: 14px"></p>
          <div class="actions">
            <button class="act" id="save" type="button" data-t="done.save" hidden></button>
            <button class="act quiet" id="again" type="button" data-t="done.again" hidden></button>
          </div>
        </div>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <!-- what this browser holds -->
    <section class="mine" id="mine" hidden>
      <h2 id="mine-title" data-t="mine.title"></h2>
      <div id="owner-block" hidden>
        <p class="fine" style="margin: 0" data-t="mine.owner"></p>
        <div class="owner-id">
          <span class="did" id="owner-did"></span>
          <button class="text" id="copy-owner" type="button" data-t="mine.copy"></button>
        </div>
        <p class="fine" style="margin: 0 0 14px" data-t="mine.owner.why"></p>
      </div>
      <h2 style="margin-top: 22px" id="list-title"></h2>
      <ul class="devices" id="devices"></ul>
      <p class="empty" id="devices-empty" data-t="mine.empty" hidden></p>
      <p class="fine" id="volatile" data-t="mine.volatile" hidden></p>
      <button class="text" id="forget" type="button" hidden></button>
    </section>
  </main>

  <footer>
    <p data-t="foot"></p>
  </footer>
</div>

<script type="module" src="./pair.js"></script>
</body>
</html>
