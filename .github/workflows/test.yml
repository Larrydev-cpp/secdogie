name: test

# Runs every component's test suite on every push and pull request -- unlike
# release.yml (which only builds/publishes binaries on a tag push or manual
# dispatch), this is the gate that actually catches a regression before it
# lands. All Python suites are written to run headless (mocked screen/input/
# network/window-backend layers -- see each component's README), so a single
# ubuntu-latest runner covers all of them; the C tunnel gets its own job for
# its own toolchain.

on:
  push:
  pull_request:

jobs:
  # --- Lint: one ruff pass over every Python component (rules in ruff.toml) --
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Lint
        run: ruff check .

  # --- Python components: one job per package, same shape for each ----------
  python-tests:
    timeout-minutes: 20  # a stuck ICE negotiation must not hold a runner for hours
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: agent
            extras: "[reflex]"  # so the reflex layer's numpy-backed tests run
          - dir: identity   # DID signing (@Larryx); pynacl comes as a hard dep
          - dir: citadel    # signed event journal + DAG goal tree
            needs_identity: true
            needs_agent: true      # so the real-loop M3 wiring tests run (not skip)
          - dir: transport  # P2P-ready peer/session/endpoint model
            needs_identity: true
            extras: "[webrtc]"     # the browser link (aiortc) runs, not skips
          - dir: fleet      # protocol/coordinator are pure; a node needs the agent it drives
            needs_agent: true
            needs_identity: true   # so the DID-signed secure-transport tests run (not skip)
          - dir: console    # web control console over the fleet, operator-DID gated
            needs_identity: true
            needs_fleet: true
          - dir: desktop    # native tkinter window; viewmodel is tested headless
            needs_identity: true
            needs_fleet: true
            needs_console: true
          - dir: dialogue   # operator Dialogue App: signed wire, Gate 2 client, structural inspector
            extras: "[tui]"  # so the Textual pilot tests run (not skip)
            needs_identity: true
            needs_citadel: true
            needs_transport: true  # so the real-UDP session round trip runs (not skip)
          - dir: node       # resident node: end-to-end loop over real UDP, process smoke tests
            needs_identity: true
            needs_citadel: true
            needs_transport: true
            needs_agent: true      # the end-to-end test drives the real agent loop
            needs_dialogue: true
            extras: "[webrtc]"     # pairing and the browser link end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        working-directory: ${{ matrix.dir }}
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.needs_agent }}" = "true" ]; then
            pip install -e ../agent
          fi
          if [ "${{ matrix.needs_identity }}" = "true" ]; then
            pip install -e ../identity
          fi
          if [ "${{ matrix.needs_citadel }}" = "true" ]; then
            pip install -e ../citadel
          fi
          if [ "${{ matrix.needs_transport }}" = "true" ]; then
            pip install -e ../transport
          fi
          if [ "${{ matrix.needs_fleet }}" = "true" ]; then
            pip install -e ../fleet
          fi
          if [ "${{ matrix.needs_console }}" = "true" ]; then
            pip install -e ../console
          fi
          if [ "${{ matrix.needs_dialogue }}" = "true" ]; then
            pip install -e "../dialogue[tui]"
          fi
          pip install -e ".${{ matrix.extras }}" pytest

      # node/tests/test_symbiont_interop.py runs the operator page's TypeScript wire
      # stack against a real node; with CI set, a missing Node fails it, never skips it.
      - uses: actions/setup-node@v4
        if: matrix.dir == 'node'
        with:
          node-version: "22"

      - name: Check the browser-link extra is really installed
        if: matrix.extras == '[webrtc]'
        run: python -c 'import aiortc, websockets; print("aiortc", aiortc.__version__, "websockets", websockets.__version__)'

      - name: Test
        working-directory: ${{ matrix.dir }}
        run: pytest tests/ -q

      # P2 commercial gate: offline CAD golden-scenario fixtures must load cleanly.
      # No real mouse / model; just validates expected.json presence + schema.
      - name: CAD scenario fixtures (offline)
        if: matrix.dir == 'agent'
        working-directory: agent
        run: python -m secdogie_agent.scenario_runner ../fixtures/cad --all

  # --- Browser P2P: signaling gateway unit tests (plain Node, no deps) --------
  webrtc-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check (gateway + browser client)
        working-directory: webrtc
        run: |
          node --check signaling/worker.js
          node --check client/web_peer.js

      - name: Test
        working-directory: webrtc
        run: npm test

  # --- Browser runtime: Rust-WASM state graph + TypeScript dual gates ---------
  # graph/ is tested natively and linted for wasm32; symbiont/ then builds the
  # wasm module and runs its tests against it (cross-language vectors from
  # fixtures/vectors, the FlowState -> AttentionGap -> Gate 1 -> Gate 2 journey,
  # the sandbox fetch boundary, and the purity grep).
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (stable, wasm32)
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt clippy

      - name: graph -- fmt, clippy, tests
        working-directory: graph
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings
          cargo test --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: symbiont -- install, build the wasm, typecheck, test, build
        working-directory: symbiont
        run: |
          npm ci
          npm run build:wasm
          npm run typecheck
          npm test
          npm run build

  # --- C tunnel: build + its own unit test binary ----------------------------
  tunnel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsodium-dev pkg-config

      - name: Build
        working-directory: tunnel
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j

      - name: Test
        working-directory: tunnel
        run: ctest --test-dir build --output-on-failure

      - name: Sanitizer build + fuzz (ASan/UBSan/LSan)
        working-directory: tunnel
        run: |
          cmake -S . -B build-asan -DSDTP_SANITIZE=ON
          cmake --build build-asan -j
          ctest --test-dir build-asan --output-on-failure
          ./build-asan/fuzz_packets 1000000

  # --- Atlas native module: Windows / Linux / macOS (same source)
  atlas-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Build
        working-directory: native/atlas
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --target atlas_test -j

      - name: Test
        working-directory: native/atlas
        run: ctest --test-dir build --output-on-failure

  # --- Atlas native module on Windows (UIA / RPM / VirtualQueryEx / token wall)
  atlas-tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (MSVC)
        working-directory: native/atlas
        run: |
          cmake -S . -B build
          cmake --build build --config Release --target atlas_test atlas_inspect atlas_mct atlas_target

      - name: Test
        working-directory: native/atlas
        run: ctest --test-dir build -C Release --output-on-failure

  atlas-tests-macos:
    runs-on: macos-latest
    timeout-minutes: 20  # fail fast: a SIP-blocked task_for_pid once hung this ~6h
    steps:
      - uses: actions/checkout@v4

      - name: Build (Apple clang, macOS 11+ / Intel + Apple Silicon)
        working-directory: native/atlas
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --target atlas_test atlas_inspect atlas_mct atlas_target -j

      - name: Test
        working-directory: native/atlas
        run: ctest --test-dir build --output-on-failure

  atlas-tests-macos-intel:
    runs-on: macos-latest
    timeout-minutes: 20  # fail fast: a SIP-blocked task_for_pid once hung the macOS job ~6h
    steps:
      - uses: actions/checkout@v4

      - name: Build x86_64 for Intel Macs (cross from Apple Silicon)
        working-directory: native/atlas
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build --target atlas_test atlas_inspect atlas_mct atlas_target -j

      - name: Verify x86_64 slice (Intel Macs Big Sur–Sequoia)
        working-directory: native/atlas
        run: |
          set -euo pipefail
          info="$(lipo -info build/atlas_test build/atlas_mct build/atlas_inspect build/atlas_target)"
          echo "$info"
          echo "$info" | grep -q x86_64 || {
            echo "FATAL: Intel x86_64 slice missing — this build cannot run on Intel Macs."
            exit 1
          }

      - name: Test under Rosetta (run the x86_64 binary; never wrap host ctest)
        working-directory: native/atlas
        run: |
          set -euo pipefail
          if arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            arch -x86_64 ./build/atlas_test
          else
            echo "Rosetta unavailable on this runner; x86_64 compile + lipo is the Intel gate."
          fi
