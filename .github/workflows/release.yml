name: release

# Builds downloadable binaries and attaches them to a GitHub Release.
# Triggers when you push a version tag (e.g. `git tag v0.1.0 && git push --tags`),
# or manually from the Actions tab (workflow_dispatch) for a dry run that only
# builds artifacts without publishing a release.

on:
  push:
    # Semantic version tags only (v1.2.3 / V1.2.3, with optional -rc1 etc.).
    # Deliberately NOT a bare "v*" / "V*" -- that also matches non-version
    # tags/branches merged as tags (e.g. a tag literally named "version"),
    # triggering an accidental release.
    # Both lower and upper case are accepted because GitHub tag names are
    # case-sensitive and people (or the UI) sometimes create V0.6.0.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "V[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

jobs:
  # --- Python agent: one single-file executable per OS -----------------------
  build-agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: agent-linux-x86_64
          - os: windows-latest
            asset: agent-windows-x86_64
          - os: macos-latest
            asset: agent-macos-arm64
            python_arch: arm64
          # Intel Mac: cross from macos-latest (Rosetta / x64 Python).
          # macos-13 is retired and queued forever, blocking publish.
          - os: macos-latest
            asset: agent-macos-x86_64
            python_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch || 'x64' }}

      - name: Build single-file executable
        shell: bash
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
          cd packaging
          pyinstaller secdogie-agent.spec --distpath ./dist --workpath ./build --noconfirm

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp agent/packaging/dist/secdogie-agent.exe "staging/${{ matrix.asset }}.exe"
          else
            cp agent/packaging/dist/secdogie-agent "staging/${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: staging/*

  # --- Python android/ios/open/scene3d: each needs agent/ installed first,
  # same one-executable-per-OS shape as build-agent. ---------------------------
  build-android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: android-linux-x86_64
          - os: windows-latest
            asset: android-windows-x86_64
          - os: macos-latest
            asset: android-macos-arm64
            python_arch: arm64
          - os: macos-latest
            asset: android-macos-x86_64
            python_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch || 'x64' }}

      - name: Build single-file executable
        shell: bash
        working-directory: android
        run: |
          python -m pip install --upgrade pip
          pip install -e ../agent
          pip install -e . pyinstaller
          cd packaging
          pyinstaller secdogie-android.spec --distpath ./dist --workpath ./build --noconfirm

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp android/packaging/dist/secdogie-android.exe "staging/${{ matrix.asset }}.exe"
          else
            cp android/packaging/dist/secdogie-android "staging/${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: staging/*

  build-ios:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: ios-linux-x86_64
          - os: windows-latest
            asset: ios-windows-x86_64
          - os: macos-latest
            asset: ios-macos-arm64
            python_arch: arm64
          - os: macos-latest
            asset: ios-macos-x86_64
            python_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch || 'x64' }}

      - name: Build single-file executable
        shell: bash
        working-directory: ios
        run: |
          python -m pip install --upgrade pip
          pip install -e ../agent
          pip install -e . pyinstaller
          cd packaging
          pyinstaller secdogie-ios.spec --distpath ./dist --workpath ./build --noconfirm

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp ios/packaging/dist/secdogie-ios.exe "staging/${{ matrix.asset }}.exe"
          else
            cp ios/packaging/dist/secdogie-ios "staging/${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: staging/*

  build-open:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: open-linux-x86_64
          - os: windows-latest
            asset: open-windows-x86_64
          - os: macos-latest
            asset: open-macos-arm64
            python_arch: arm64
          - os: macos-latest
            asset: open-macos-x86_64
            python_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch || 'x64' }}

      - name: Build single-file executable
        shell: bash
        working-directory: open
        run: |
          python -m pip install --upgrade pip
          pip install -e ../agent
          pip install -e . pyinstaller
          cd packaging
          pyinstaller secdogie-open.spec --distpath ./dist --workpath ./build --noconfirm

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp open/packaging/dist/secdogie-open.exe "staging/${{ matrix.asset }}.exe"
          else
            cp open/packaging/dist/secdogie-open "staging/${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: staging/*

  build-scene3d:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: scene3d-linux-x86_64
          - os: windows-latest
            asset: scene3d-windows-x86_64
          - os: macos-latest
            asset: scene3d-macos-arm64
            python_arch: arm64
          - os: macos-latest
            asset: scene3d-macos-x86_64
            python_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch || 'x64' }}

      - name: Build single-file executable
        shell: bash
        working-directory: scene3d
        run: |
          python -m pip install --upgrade pip
          pip install -e ../agent
          pip install -e . pyinstaller
          cd packaging
          pyinstaller secdogie-scene3d.spec --distpath ./dist --workpath ./build --noconfirm

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp scene3d/packaging/dist/secdogie-scene3d.exe "staging/${{ matrix.asset }}.exe"
          else
            cp scene3d/packaging/dist/secdogie-scene3d "staging/${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: staging/*

  build-tunnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsodium-dev pkg-config

      - name: Build
        working-directory: tunnel
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j

      - name: Stage artifact
        run: |
          mkdir -p staging
          cp tunnel/build/secdogie-tunnel staging/tunnel-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-linux-x86_64
          path: staging/*

  # Native MCT: atlas_inspect + atlas_target per OS/arch. Intel Mac is
  # cross-compiled on macos-latest (CMAKE_OSX_ARCHITECTURES=x86_64), never
  # macos-13.
  build-atlas:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: atlas-linux-x86_64
            cmake_osx_arch: ""
          - os: windows-latest
            asset: atlas-windows-x86_64
            cmake_osx_arch: ""
          - os: macos-latest
            asset: atlas-macos-arm64
            cmake_osx_arch: arm64
          - os: macos-latest
            asset: atlas-macos-x86_64
            cmake_osx_arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Build
        shell: bash
        working-directory: native/atlas
        run: |
          extra=()
          if [ -n "${{ matrix.cmake_osx_arch }}" ]; then
            extra+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_osx_arch }})
            extra+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -S . -B build "${extra[@]}"
            cmake --build build --config Release --target atlas_inspect atlas_mct atlas_target
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo "${extra[@]}"
            cmake --build build --target atlas_inspect atlas_mct atlas_target -j
          fi

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp native/atlas/build/Release/atlas_inspect.exe staging/atlas_inspect.exe
            cp native/atlas/build/Release/atlas_mct.exe staging/atlas_mct.exe
            cp native/atlas/build/Release/atlas_target.exe staging/atlas_target.exe
          else
            cp native/atlas/build/atlas_inspect staging/atlas_inspect
            cp native/atlas/build/atlas_mct staging/atlas_mct
            cp native/atlas/build/atlas_target staging/atlas_target
            chmod +x staging/*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: staging/*

  # Universal Mac binary: lipo arm64 (Apple Silicon) + x86_64 (Intel).
  # Operators who do not know the chip download this one. continue-on-error
  # so a lipo flake does not block the per-arch assets.
  build-atlas-universal:
    needs: [build-atlas]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: atlas-macos-*
          path: downloaded

      - name: lipo arm64 + x86_64
        run: |
          set -euo pipefail
          mkdir -p staging
          for bin in atlas_inspect atlas_mct atlas_target; do
            arm="downloaded/atlas-macos-arm64/${bin}"
            intel="downloaded/atlas-macos-x86_64/${bin}"
            if [ ! -f "$arm" ] || [ ! -f "$intel" ]; then
              echo "missing $bin slice"
              ls -l downloaded/atlas-macos-arm64 downloaded/atlas-macos-x86_64 || true
              exit 1
            fi
            lipo -create "$arm" "$intel" -output "staging/${bin}"
            info="$(lipo -info "staging/${bin}")"
            echo "$info"
            echo "$info" | grep -q arm64
            echo "$info" | grep -q x86_64
            chmod +x "staging/${bin}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-macos-universal
          path: staging/*

  publish:
    needs: [build-agent, build-android, build-ios, build-open, build-scene3d, build-tunnel, build-atlas, build-atlas-universal]
    runs-on: ubuntu-latest
    # Publish even if one arch failed (Intel Python on ARM can flake). A
    # cancelled run still skips. Manual dispatch (no tag) still skips.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Package release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME}"
          mkdir -p release pkg

          # package name binary inner [extra files...]
          # Produces:
          #  * a bare binary named secdogie-<component>-<platform>-<version>[.exe]
          #    self-contained (built-in menu, config in the user dir, launchers are
          #    optional), so nothing needs to sit beside it.
          #  * a .zip with docs + the double-click launcher, for anyone who wants
          #    the full bundle (a console window on Windows, the macOS Gatekeeper
          #    right-click-open helper, etc.).
          package() {
            local name="$1"; local binary="$2"; local inner="$3"; shift 3
            # Bare binary, keeping the extension so Windows still recognizes it.
            local ext=""; case "$inner" in *.exe) ext=".exe" ;; esac
            cp "$binary" "release/${name}${ext}"
            [ -x "$binary" ] && chmod +x "release/${name}${ext}" || true
            local dir="pkg/${name}"
            rm -rf "$dir" && mkdir -p "$dir"
            cp "$binary" "$dir/${inner}"
            [ -f "$dir/${inner}" ] && [ -x "$binary" ] && chmod +x "$dir/${inner}" || true
            for d in "$@"; do cp "$d" "$dir/"; done
            # keep shell launchers executable inside the zip
            chmod +x "$dir"/*.command "$dir"/*.sh 2>/dev/null || true
            (cd pkg && zip -r "../release/${name}.zip" "${name}")
          }

          # Agent binaries (one per platform). Keep .exe on Windows so it runs;
          # give it a clean inner name regardless of the artifact's own name.
          # Bundle the matching double-click launcher so non-technical users can
          # just run open.bat / open.command / run.sh.
          for f in downloaded/agent-*/*; do
            base="$(basename "$f")"                    # agent-linux-x86_64 | agent-windows-x86_64.exe | agent-macos-arm64
            platform="${base#agent-}"; platform="${platform%.exe}"
            case "$base" in
              *windows*) inner="secdogie-agent.exe"; launcher="agent/packaging/launchers/open.bat" ;;
              *macos*)   inner="secdogie-agent";     launcher="agent/packaging/launchers/open.command" ;;
              *)         inner="secdogie-agent";     launcher="agent/packaging/launchers/run.sh" ;;
            esac
            package "secdogie-agent-${platform}-${version}" "$f" "$inner" \
              "$launcher" agent/README.md agent/packaging/README.md LICENSE
          done

          # android/ios/open/scene3d binaries (one per platform each), same
          # shape as agent above.
          for f in downloaded/android-*/*; do
            base="$(basename "$f")"
            platform="${base#android-}"; platform="${platform%.exe}"
            case "$base" in
              *.exe) inner="secdogie-android.exe" ;;
              *)     inner="secdogie-android" ;;
            esac
            package "secdogie-android-${platform}-${version}" "$f" "$inner" \
              android/README.md LICENSE
          done

          for f in downloaded/ios-*/*; do
            base="$(basename "$f")"
            platform="${base#ios-}"; platform="${platform%.exe}"
            case "$base" in
              *.exe) inner="secdogie-ios.exe" ;;
              *)     inner="secdogie-ios" ;;
            esac
            package "secdogie-ios-${platform}-${version}" "$f" "$inner" \
              ios/README.md LICENSE
          done

          for f in downloaded/open-*/*; do
            base="$(basename "$f")"
            platform="${base#open-}"; platform="${platform%.exe}"
            case "$base" in
              *.exe) inner="secdogie-open.exe" ;;
              *)     inner="secdogie-open" ;;
            esac
            package "secdogie-open-${platform}-${version}" "$f" "$inner" \
              open/README.md LICENSE
          done

          for f in downloaded/scene3d-*/*; do
            base="$(basename "$f")"
            platform="${base#scene3d-}"; platform="${platform%.exe}"
            case "$base" in
              *.exe) inner="secdogie-scene3d.exe" ;;
              *)     inner="secdogie-scene3d" ;;
            esac
            package "secdogie-scene3d-${platform}-${version}" "$f" "$inner" \
              scene3d/README.md LICENSE
          done

          # Native MCT (atlas_inspect + atlas_target) per OS/arch.
          for dir in downloaded/atlas-*; do
            [ -d "$dir" ] || continue
            platform="${dir##*/atlas-}"
            case "$platform" in
              *windows*) inner_inspect="atlas_inspect.exe"; inner_mct="atlas_mct.exe"; inner_target="atlas_target.exe" ;;
              *)         inner_inspect="atlas_inspect";     inner_mct="atlas_mct";     inner_target="atlas_target" ;;
            esac
            inspect="$(echo "$dir"/atlas_inspect*)"
            mct="$(echo "$dir"/atlas_mct*)"
            target="$(echo "$dir"/atlas_target*)"
            [ -f "$inspect" ] || continue
            name="secdogie-atlas-${platform}-${version}"
            mkdir -p "pkg/${name}"
            cp "$inspect" "pkg/${name}/${inner_inspect}"
            [ -f "$mct" ] && cp "$mct" "pkg/${name}/${inner_mct}" || true
            [ -f "$target" ] && cp "$target" "pkg/${name}/${inner_target}" || true
            chmod +x "pkg/${name}/"* 2>/dev/null || true
            cp native/atlas/README.md native/atlas/PLATFORMS.md LICENSE "pkg/${name}/" 2>/dev/null || true
            (cd pkg && zip -r "../release/${name}.zip" "${name}")
            cp "$inspect" "release/${name}-${inner_inspect}"
            [ -x "$inspect" ] && chmod +x "release/${name}-${inner_inspect}" || true
          done

          # Tunnel binary (Linux only).
          for f in downloaded/tunnel-*/*; do
            package "secdogie-tunnel-linux-x86_64-${version}" "$f" "secdogie-tunnel" \
              tunnel/README.md tunnel/PROTOCOL.md LICENSE
          done

          ls -la release

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Idempotent: a re-run (retry, or re-pushing the same tag after
          # deleting/recreating it) must not fail just because a release for
          # this tag already exists -- replace it rather than erroring out.
          # --cleanup-tag is deliberately omitted: it would delete the tag
          # that triggered this very run.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists -- deleting it before recreating"
            gh release delete "$tag" --yes
          fi
          # Everything in release/ is an asset: the bare binaries (one-file
          # downloads) and the .zip bundles (binary + docs + launcher).
          gh release create "$tag" \
            release/* \
            --title "$tag" \
            --generate-notes
