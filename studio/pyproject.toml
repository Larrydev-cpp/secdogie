[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secdogie-studio"
version = "0.1.0"
description = "secdogie Studio: the desktop app (Windows, macOS, Linux). Creates this machine's keys, runs the node as a child that stops with the window, and talks to it over the DID-authenticated operator dialogue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The node runs as a child process (secdogie-node); the window is one more
# operator App over the dialogue (secdogie-dialogue) and the transport.
dependencies = [
    "secdogie-identity",
    "secdogie-transport",
    "secdogie-citadel",
    "secdogie-policy",
    "secdogie-dialogue",
    "secdogie-node",
    "PyYAML>=6",  # the rules editor reads YAML
]

[project.optional-dependencies]
# The window. PySide6-Essentials is Qt Widgets without WebEngine / QML / 3D,
# which keeps the bundle and the attack surface small (decision 1 in the plan).
gui = ["PySide6-Essentials>=6.7"]  # per-corner radii (6.7)

[project.scripts]
secdogie-studio = "secdogie_studio.cli:main"

[tool.setuptools.packages.find]
include = ["secdogie_studio*"]

[tool.setuptools.package-data]
secdogie_studio = ["qml/*.qml", "qml/qmldir"]
